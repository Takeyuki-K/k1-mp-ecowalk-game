[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "k1-ecowalk-game"
version = "0.2.0"
description = "CPU MuJoCo EcoWalk teleoperation energy challenge"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "mujoco>=3.3.7,<4", "Pillow>=10", "torch>=2.6"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
k1-game = "k1_ecowalk_game.app:main"
k1-ranking = "k1_ecowalk_game.ranking:main"
[tool.setuptools.package-data]
k1_ecowalk_game = ["web/*"]

[tool.setuptools.packages.find]
include = ["k1_ecowalk_game", "k1_ecowalk_game.*"]
namespaces = false
